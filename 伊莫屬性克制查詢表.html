<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伊莫全方位剋制查詢工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

    <header class="w-full max-w-4xl text-center mb-6">
        <h1 class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent mb-2">
            伊莫全方位剋制查詢工具
        </h1>
        <p class="text-slate-400 text-sm sm:text-base">
            快速查詢伊莫的「元素相剋」與「空間關係」，助您戰無不勝！
        </p>
    </header>

    <!-- Tab Navigation Buttons -->
    <div class="flex justify-center gap-3 mb-6">
        <button id="btn-element" onclick="switchTab('element')" class="px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
            <span>⚡</span> 元素相剋查詢
        </button>
        <button id="btn-spatial" onclick="switchTab('spatial')" class="px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800">
            <span>🪐</span> 空間關係查詢
        </button>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-4xl">

        <!-- SECTION 1: 元素相剋 -->
        <div id="section-element" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left: Defender Selection -->
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col justify-between backdrop-blur-md">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2 text-cyan-400">
                            <span>🛡️</span> 設定 BOSS 防守屬性
                        </h2>
                        <span id="selected-count" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">已選 0 / 2</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-400 mb-5">點擊下方圖示選擇 BOSS 屬性（支援單或雙屬性）：</p>

                    <!-- Element Buttons Grid -->
                    <div class="grid grid-cols-3 gap-3 mb-6" id="element-buttons-container">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <button onclick="resetElementSelection()" class="w-full py-2.5 bg-slate-800/80 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-medium transition border border-slate-700/50 flex items-center justify-center gap-2">
                    <span>🔄</span> 重設選擇
                </button>
            </div>

            <!-- Right: Results & Recommendations -->
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-xl backdrop-blur-md flex flex-col gap-5">
                <!-- Recommended Attacking Attributes -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-md font-semibold flex items-center gap-2 text-emerald-400">
                            <span>⚔️</span> 建議使用屬性
                        </h3>
                        <span class="text-xs bg-emerald-950/80 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-800/50">剋制 (^)</span>
                    </div>
                    <div id="recommendation-list" class="space-y-2.5 min-h-[110px] flex flex-col justify-center">
                        <p class="text-slate-500 text-sm text-center py-4">請先在左側選擇至少一個 BOSS 防守屬性</p>
                    </div>
                </div>

                <hr class="border-slate-800">

                <!-- Disadvised Attacking Attributes -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-md font-semibold flex items-center gap-2 text-rose-400">
                            <span>⚠️</span> 不建議使用屬性
                        </h3>
                        <span class="text-xs bg-rose-950/80 text-rose-300 px-2.5 py-0.5 rounded-full border border-rose-800/50">被剋制/劣勢 (v)</span>
                    </div>
                    <div id="disadvantage-list" class="space-y-2.5 min-h-[110px] flex flex-col justify-center">
                        <p class="text-slate-500 text-sm text-center py-4">請先在左側選擇至少一個 BOSS 防守屬性</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION 2: 空間關係 -->
        <div id="section-spatial" class="hidden">
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md">
                <h2 class="text-lg font-semibold text-amber-400 mb-2 flex items-center gap-2">
                    <span>🪐</span> 空間克制關係查詢
                </h2>
                <p class="text-sm text-slate-400 mb-6">點選其中一個空間類型，查看其剋制與難以攻擊對象：</p>

                <!-- Spatial Type Buttons -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
                    <button onclick="selectSpatial('ranged')" id="spatial-btn-ranged" class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition text-center flex flex-col items-center gap-2">
                        <span class="text-2xl">☄️</span>
                        <span class="font-medium text-sm">遠程</span>
                    </button>
                    <button onclick="selectSpatial('flying')" id="spatial-btn-flying" class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition text-center flex flex-col items-center gap-2">
                        <span class="text-2xl">🪶</span>
                        <span class="font-medium text-sm">飛行</span>
                    </button>
                    <button onclick="selectSpatial('burrow')" id="spatial-btn-burrow" class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition text-center flex flex-col items-center gap-2">
                        <span class="text-2xl">🪵</span>
                        <span class="font-medium text-sm">鑽地</span>
                    </button>
                    <button onclick="selectSpatial('quake')" id="spatial-btn-quake" class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition text-center flex flex-col items-center gap-2">
                        <span class="text-2xl">⚡</span>
                        <span class="font-medium text-sm">震地</span>
                    </button>
                </div>

                <!-- Spatial Results Display -->
                <div id="spatial-result-card" class="bg-slate-950/60 border border-slate-800 rounded-xl p-5">
                    <p class="text-slate-500 text-sm text-center">請點選上方任一空間類型以查看克制資訊</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Element Data definition
        const elements = [
            { id: 'ice', name: '冰', icon: '❄️', color: 'from-cyan-500/20 to-blue-500/20 border-cyan-500/40' },
            { id: 'water', name: '水', icon: '💧', color: 'from-blue-500/20 to-indigo-500/20 border-blue-500/40' },
            { id: 'electric', name: '電', icon: '⚡', color: 'from-amber-500/20 to-yellow-500/20 border-amber-500/40' },
            { id: 'fire', name: '火', icon: '🔥', color: 'from-red-500/20 to-orange-500/20 border-red-500/40' },
            { id: 'grass', name: '草', icon: '🍃', color: 'from-emerald-500/20 to-green-500/20 border-emerald-500/40' },
            { id: 'rock', name: '岩', icon: '🏔️', color: 'from-stone-500/20 to-amber-700/20 border-stone-500/40' },
            { id: 'wind', name: '風', icon: '🌀', color: 'from-teal-500/20 to-cyan-500/20 border-teal-500/40' },
            { id: 'dark', name: '暗', icon: '🟣', color: 'from-purple-500/20 to-violet-500/20 border-purple-500/40' },
            { id: 'light', name: '光', icon: '☀️', color: 'from-yellow-500/20 to-orange-500/20 border-yellow-500/40' }
        ];

        // Matrix: attack vs defense. true = advantage (^), false = disadvantage (v)
        const elementMatrix = {
            ice: { ice: false, water: true, electric: true, fire: false, grass: false, rock: true, wind: false, dark: false, light: false },
            water: { ice: false, water: false, electric: false, fire: true, grass: false, rock: true, wind: false, dark: false, light: false },
            electric: { ice: false, water: true, electric: false, fire: false, grass: false, rock: false, wind: true, dark: false, light: false },
            fire: { ice: true, water: false, electric: false, fire: false, grass: true, rock: false, wind: false, dark: false, light: false },
            grass: { ice: false, water: true, electric: false, fire: false, grass: false, rock: true, wind: false, dark: false, light: false },
            rock: { ice: true, water: false, electric: false, fire: true, grass: false, rock: false, wind: false, dark: false, light: false },
            wind: { ice: false, water: false, electric: false, fire: false, grass: true, rock: false, wind: false, dark: false, light: true },
            dark: { ice: false, water: false, electric: true, fire: false, grass: true, rock: false, wind: false, dark: false, light: true },
            light: { ice: false, water: false, electric: false, fire: false, grass: false, rock: false, wind: true, dark: true, light: false }
        };

        let selectedDefenders = [];

        function renderElementButtons() {
            const container = document.getElementById('element-buttons-container');
            container.innerHTML = '';
            elements.forEach(el => {
                const isSelected = selectedDefenders.includes(el.id);
                const btn = document.createElement('button');
                btn.onclick = () => toggleDefender(el.id);
                btn.className = `p-3.5 rounded-xl border flex flex-col items-center justify-center gap-1.5 transition-all duration-200 relative ${
                    isSelected 
                    ? 'bg-amber-500/20 border-amber-400 text-amber-300 shadow-lg shadow-amber-500/20 ring-2 ring-amber-400/50' 
                    : 'bg-slate-800/50 border-slate-700/80 text-slate-300 hover:bg-slate-800 hover:border-slate-600'
                }`;
                
                btn.innerHTML = `
                    <span class="text-2xl">${el.icon}</span>
                    <span class="text-xs font-medium">${el.name}</span>
                    ${isSelected ? '<span class="absolute top-1.5 right-1.5 text-[10px] bg-amber-400 text-slate-950 font-bold px-1.5 py-0.5 rounded-full">已選</span>' : ''}
                `;
                container.appendChild(btn);
            });
        }

        function toggleDefender(id) {
            if (selectedDefenders.includes(id)) {
                selectedDefenders = selectedDefenders.filter(item => item !== id);
            } else {
                if (selectedDefenders.length >= 2) {
                    selectedDefenders.shift(); // keep max 2
                }
                selectedDefenders.push(id);
            }
            updateUI();
        }

        function resetElementSelection() {
            selectedDefenders = [];
            updateUI();
        }

        function updateUI() {
            renderElementButtons();
            document.getElementById('selected-count').innerText = `已選 ${selectedDefenders.length} / 2`;
            
            const recContainer = document.getElementById('recommendation-list');
            const disContainer = document.getElementById('disadvantage-list');

            if (selectedDefenders.length === 0) {
                recContainer.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">請先在左側選擇至少一個 BOSS 防守屬性</p>';
                disContainer.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">請先在左側選擇至少一個 BOSS 防守屬性</p>';
                return;
            }

            // Calculate advantages and disadvantages
            let advantages = [];
            let disadvantages = [];

            elements.forEach(attacker => {
                let advScore = 0;
                let disAdvScore = 0;

                selectedDefenders.forEach(defId => {
                    if (elementMatrix[attacker.id][defId] === true) advScore++;
                    if (elementMatrix[attacker.id][defId] === false) disAdvScore++;
                });

                if (advScore > 0 && disAdvScore === 0) {
                    advantages.push(attacker);
                } else if (disAdvScore > 0 && advScore === 0) {
                    disadvantages.push(attacker);
                }
            });

            // Render Recommendations
            if (advantages.length === 0) {
                recContainer.innerHTML = '<p class="text-slate-400 text-sm text-center py-3">沒有完全完美剋制的屬性組合</p>';
            } else {
                recContainer.innerHTML = advantages.map(el => `
                    <div class="flex items-center justify-between p-3 bg-emerald-950/30 border border-emerald-900/50 rounded-xl">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${el.icon}</span>
                            <div>
                                <span class="font-medium text-sm text-emerald-200">${el.name}屬性</span>
                                <p class="text-xs text-slate-400">剋制 BOSS 的 ${selectedDefenders.map(d => elements.find(e => e.id === d).name).join(', ')}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-emerald-500/20 text-emerald-300 font-bold px-2.5 py-1 rounded-lg border border-emerald-500/30">^ 絕佳</span>
                    </div>
                `).join('');
            }

            // Render Disadvantages
            if (disadvantages.length === 0) {
                disContainer.innerHTML = '<p class="text-slate-400 text-sm text-center py-3">無明顯不建議屬性</p>';
            } else {
                disContainer.innerHTML = disadvantages.map(el => `
                    <div class="flex items-center justify-between p-3 bg-rose-950/30 border border-rose-900/50 rounded-xl">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${el.icon}</span>
                            <div>
                                <span class="font-medium text-sm text-rose-200">${el.name}屬性</span>
                                <p class="text-xs text-slate-400">被 BOSS 的 ${selectedDefenders.map(d => elements.find(e => e.id === d).name).join(', ')} 剋制</p>
                            </div>
                        </div>
                        <span class="text-xs bg-rose-500/20 text-rose-300 font-bold px-2.5 py-1 rounded-lg border border-rose-500/30">v 劣勢</span>
                    </div>
                `).join('');
            }
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const btnEl = document.getElementById('btn-element');
            const btnSp = document.getElementById('btn-spatial');
            const secEl = document.getElementById('section-element');
            const secSp = document.getElementById('section-spatial');

            if (tab === 'element') {
                btnEl.className = "px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
                btnSp.className = "px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800";
                secEl.classList.remove('hidden');
                secSp.classList.add('hidden');
            } else {
                btnSp.className = "px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-amber-600 text-white shadow-lg shadow-amber-600/30";
                btnEl.className = "px-5 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center gap-2 bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800";
                secSp.classList.remove('hidden');
                secEl.classList.add('hidden');
            }
        }

        // Spatial Data
        const spatialData = {
            ranged: { title: "遠程", icon: "☄️", advantage: "飛行", hardToAttack: "鑽地" },
            flying: { title: "飛行", icon: "🪶", advantage: "（被遠程剋制）", hardToAttack: "（能攻擊遠程，但受限於機制）" },
            burrow: { title: "鑽地", icon: "🪵", advantage: "震地", hardToAttack: "遠程" },
            quake: { title: "震地", icon: "⚡", advantage: "（被鑽地剋制）", hardToAttack: "飛行" }
        };

        function selectSpatial(type) {
            // Highlight buttons
            ['ranged', 'flying', 'burrow', 'quake'].forEach(t => {
                const btn = document.getElementById(`spatial-btn-${t}`);
                if (t === type) {
                    btn.className = "p-4 rounded-xl border border-amber-500 bg-amber-500/20 text-amber-300 transition text-center flex flex-col items-center gap-2 shadow-lg shadow-amber-500/20";
                } else {
                    btn.className = "p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 transition text-center flex flex-col items-center gap-2 text-slate-300";
                }
            });

            const data = spatialData[type];
            const card = document.getElementById('spatial-result-card');

            card.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-3xl">${data.icon}</span>
                    <div>
                        <h3 class="text-lg font-bold text-amber-300">${data.title} 空間關係</h3>
                        <p class="text-xs text-slate-400">依據遊戲空間克制規則</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="p-3.5 bg-emerald-950/30 border border-emerald-900/50 rounded-xl">
                        <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider block mb-1">✨ 剋制目標</span>
                        <span class="text-sm font-medium text-emerald-200">${type === 'ranged' ? '飛行 ➔ 剋制飛行' : type === 'burrow' ? '震地 ➔ 剋制震地' : '無直接主動剋制'}</span>
                    </div>
                    <div class="p-3.5 bg-rose-950/30 border border-rose-900/50 rounded-xl">
                        <span class="text-xs text-rose-400 font-semibold uppercase tracking-wider block mb-1">🛡️ 難以攻擊（被反制）</span>
                        <span class="text-sm font-medium text-rose-200">${type === 'ranged' ? '難以攻擊 ➔ 鑽地' : type === 'burrow' ? '難以攻擊 ➔ 遠程' : type === 'flying' ? '對手難以攻擊飛行' : '難以攻擊飛行'}</span>
                    </div>
                </div>
            `;
        }

        // Initial render
        renderElementButtons();
    </script>
</body>
</html>
